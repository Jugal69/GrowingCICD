[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growingcicd"
version = "0.1.0"
description = "A small example package for validating JSON configuration"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["growingcicd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
