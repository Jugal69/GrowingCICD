[workspace]
authors = ["GrowingCICD contributors"]
channels = ["conda-forge"]
name = "growingcicd"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
lint = "ruff check ."
test = "pytest"
validate-config = "python -m growingcicd.cli config.example.json --report reports/validation-report.json"
ci = { depends-on = ["lint", "test", "validate-config"] }

[dependencies]
python = ">=3.10,<4"

[pypi-dependencies]
pytest = ">=8,<9"
ruff = ">=0.11,<1"
